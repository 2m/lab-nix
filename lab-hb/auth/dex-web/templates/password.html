{{ template "header.html" . }}

<div class="theme-panel">
    <h2 class="theme-heading">Log in to Your Account</h2>

    <div class="quick-login-grid">
        <button
            type="button"
            class="quick-login-btn"
            onclick="quickLogin('tynas@2m.lt', 'tynas')"
        >
            <img src="/static/avatars/tynas.jpg" />
            <span class="name">tynas</span>
        </button>
        <button
            type="button"
            class="quick-login-btn"
            onclick="quickLogin('myda@2m.lt', 'myda')"
        >
            <img src="/static/avatars/myda.jpg" />
            <span class="name">myda</span>
        </button>
    </div>

    <style>
        .quick-login-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            margin: 48px 0;
            flex-wrap: wrap;
        }
        .quick-login-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }
        .quick-login-btn .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            font-weight: 600;
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }
        .quick-login-btn:hover .avatar {
            transform: scale(1.08);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }
        .quick-login-btn .name {
            font-size: 14px;
            color: var(--theme-text-color, #333);
            text-align: center;
        }
    </style>

    <script>
        function quickLogin(login, password) {
            document.getElementById("login").value = login;
            document.getElementById("password").value = password;
            document.querySelector("form").submit();
        }
    </script>

    <form method="post" action="{{ .PostURL }}" style="display: none">
        <div class="theme-form-row">
            <div class="theme-form-label">
                <label for="login">{{ .UsernamePrompt }}</label>
            </div>
            <input
                tabindex="1"
                required
                id="login"
                name="login"
                type="text"
                class="theme-form-input"
                placeholder="{{ .UsernamePrompt | lower }}"
                {{
                if
                .Username
                }}
                value="{{ .Username }}"
                {{
                else
                }}
                autofocus
                {{
                end
                }}
            />
        </div>
        <div class="theme-form-row">
            <div class="theme-form-label">
                <label for="password">Password</label>
            </div>
            <input
                tabindex="2"
                required
                id="password"
                name="password"
                type="password"
                class="theme-form-input"
                placeholder="password"
                {{
                if
                .Invalid
                }}
                autofocus
                {{
                end
                }}
            />
        </div>

        {{ if .Invalid }}
        <div id="login-error" class="dex-error-box">
            Invalid {{ .UsernamePrompt }} and password.
        </div>
        {{ end }}

        <button
            tabindex="3"
            id="submit-login"
            type="submit"
            class="dex-btn theme-btn--primary"
        >
            Login
        </button>
    </form>

    {{ if .BackLink }}
    <div class="theme-link-back">
        <a class="dex-subtle-text" href="{{ .BackLink }}"
            >Select another login method.</a
        >
    </div>
    {{ end }}
</div>

<script type="text/javascript">
    document.querySelector("form").onsubmit = function (e) {
        var el = document.querySelector("#submit-login");
        el.setAttribute("disabled", "disabled");
    };
</script>

{{ template "footer.html" . }}
